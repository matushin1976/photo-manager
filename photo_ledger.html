<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>写真台帳｜点名・遠景・近景</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:#17212c;font-family:'Yu Gothic','Meiryo',sans-serif}button,input{font:inherit}button{cursor:pointer}.toolbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #cbd5e1;padding:12px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;box-shadow:0 2px 8px #0001}.toolbar strong{font-size:18px;margin-right:auto}.toolbar button,.file-button{border:1px solid #a6b3c5;background:#fff;color:#1e293b;padding:8px 14px;border-radius:6px}.toolbar .primary{background:#19466e;color:#fff;border-color:#19466e}.note{font-size:12px;color:#526174;padding:10px 18px;text-align:center}.pages{display:grid;justify-content:center;gap:18px;padding:0 12px 30px}.page{width:210mm;min-height:297mm;background:#fff;box-shadow:0 3px 18px #0002;padding:12mm 10mm 11mm;display:flex;flex-direction:column;page-break-after:always;break-after:page}.page-title{font-size:17px;font-weight:700;letter-spacing:.17em;text-align:center;margin:0 0 7mm}.point{border:1px solid #384250;margin:0 0 3mm;break-inside:avoid}.point-header{height:9mm;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #384250;padding:0 8px;font-size:13px}.point-header label{display:flex;align-items:center;gap:8px}.point-header input{font-weight:bold;min-width:0;width:140px;border:0;border-bottom:1px dotted #a4adba;border-radius:0;background:transparent;padding:2px 4px;outline:0}.point-header input:focus{border-bottom-color:#174b75}.delete{border:0;background:none;color:#a02d2d;font-size:12px}.pictures{display:grid;grid-template-columns:1fr 1fr}.photo-cell{min-width:0}.photo-cell + .photo-cell{border-left:1px solid #384250}.photo-label{text-align:center;border-bottom:1px solid #384250;font-size:12px;padding:3px 0}.photo-slot{height:61mm;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;color:#7b8797;font-size:12px;cursor:pointer}.photo-slot.drag{background:#deefff}.photo-slot img{width:100%;height:100%;object-fit:contain}.photo-slot input[type=file]{display:none}.photo-slot .placeholder{text-align:center;line-height:1.9}.photo-slot .remove-photo{position:absolute;right:4px;top:4px;background:#fffdf0;border:1px solid #9aa7b2;border-radius:3px;padding:2px 6px;color:#9b2222;font-size:12px}.page-footer{margin-top:auto;text-align:center;font-size:11px}.empty{font-size:12px;color:#777;text-align:center}.no-print{}
@media(max-width:850px){.pages{justify-content:start;overflow-x:auto}.toolbar strong{width:100%}}@page{size:A4 portrait;margin:0}@media print{body{background:white}.toolbar,.note,.delete,.remove-photo,.no-print{display:none!important}.pages{padding:0;gap:0;display:block}.page{width:210mm;height:297mm;min-height:0;box-shadow:none;margin:0;overflow:hidden}.point-header input{border:0;appearance:none}.photo-slot{cursor:default}.photo-slot .placeholder{color:transparent}.page:last-child{page-break-after:auto;break-after:auto}}
</style></head><body>
<div class="toolbar"><strong>写真台帳</strong><button type="button" id="add" class="primary">＋ 点を追加</button><button type="button" id="save">データ保存</button><button type="button" id="load">データ読込</button><button type="button" id="print">印刷 / PDF</button><input type="file" id="load-input" accept=".json,application/json" hidden></div>
<div class="note">点名を入力し、遠景・近景の枠をクリックして写真を選択（ドラッグ＆ドロップも可）。A4縦・1ページ3点です。</div>
<main class="pages" id="pages"></main>
<script>
(()=>{'use strict';
let points=[{name:'',far:null,near:null}];
const $=s=>document.querySelector(s), escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function slot(photo,i,kind){let caption=kind==='far'?'遠景':'近景';return `<div class="photo-cell"><div class="photo-label">${caption}</div><div class="photo-slot" data-i="${i}" data-kind="${kind}" title="クリックして写真を選択">${photo?`<img src="${photo}" alt="${caption}"><button type="button" class="remove-photo no-print" title="写真を削除">×</button>`:`<div class="placeholder no-print">写真を選択<br>またはドロップ</div>`}<input type="file" accept="image/*"></div></div>`}
function render(){let html='';for(let start=0;start<points.length;start+=3){let subset=points.slice(start,start+3);html+=`<section class="page"><h1 class="page-title">写真台帳</h1>`+subset.map((p,j)=>{const i=start+j;return `<section class="point"><div class="point-header"><label>点名 <input data-name="${i}" value="${escape(p.name)}" placeholder="点名を入力"></label><button class="delete no-print" data-delete="${i}" type="button">点を削除</button></div><div class="pictures">${slot(p.far,i,'far')}${slot(p.near,i,'near')}</div></section>`}).join('')+`<div class="page-footer">${Math.floor(start/3)+1}</div></section>`}$('#pages').innerHTML=html}
async function fileToDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file)})}
async function setPhoto(i,kind,file){if(!file||!file.type.startsWith('image/'))return;try{points[i][kind]=await fileToDataUrl(file);render()}catch(e){alert('画像を読み込めませんでした。')}}
$('#pages').addEventListener('input',e=>{if(e.target.matches('[data-name]')){points[+e.target.dataset.name].name=e.target.value}});
$('#pages').addEventListener('click',e=>{let del=e.target.closest('[data-delete]');if(del){if(points.length===1){points[0]={name:'',far:null,near:null}}else points.splice(+del.dataset.delete,1);render();return}let remove=e.target.closest('.remove-photo');if(remove){let slot=remove.closest('.photo-slot');points[+slot.dataset.i][slot.dataset.kind]=null;render();return}let slot=e.target.closest('.photo-slot');if(slot)slot.querySelector('input[type=file]').click()});
$('#pages').addEventListener('change',e=>{if(e.target.matches('.photo-slot input[type=file]')){let slot=e.target.closest('.photo-slot');setPhoto(+slot.dataset.i,slot.dataset.kind,e.target.files[0])}});
$('#pages').addEventListener('dragover',e=>{let slot=e.target.closest('.photo-slot');if(slot){e.preventDefault();slot.classList.add('drag')}});
$('#pages').addEventListener('dragleave',e=>{let slot=e.target.closest('.photo-slot');if(slot)slot.classList.remove('drag')});
$('#pages').addEventListener('drop',e=>{let slot=e.target.closest('.photo-slot');if(slot){e.preventDefault();slot.classList.remove('drag');setPhoto(+slot.dataset.i,slot.dataset.kind,e.dataTransfer.files[0])}});
$('#add').onclick=()=>{points.push({name:'',far:null,near:null});render();document.querySelector(`[data-name="${points.length-1}"]`)?.focus()};
$('#print').onclick=()=>window.print();
$('#save').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,points})],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='写真台帳.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#load').onclick=()=>$('#load-input').click();$('#load-input').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.points)||!obj.points.length)throw Error('invalid');points=obj.points.map(p=>({name:String(p.name??''),far:typeof p.far==='string'?p.far:null,near:typeof p.near==='string'?p.near:null}));render()}catch(err){alert('写真台帳データを読み込めませんでした。')}e.target.value=''};
render();
})();
</script></body></html>
