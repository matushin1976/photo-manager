<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>現場写真アップロード</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f7;color:#17252f}main{max-width:600px;margin:auto;padding:18px}section{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 9px #0001}h1{font-size:1.4rem}label{display:block;margin:12px 0 5px;font-weight:600}input,select,button{box-sizing:border-box;width:100%;font:inherit;padding:11px;border-radius:8px;border:1px solid #aebac3}button{background:#126958;color:white;border:0;margin-top:12px;font-weight:600}button:disabled{opacity:.45}small{color:#54616a}li{margin:8px 0}#status{white-space:pre-wrap}progress{width:100%}.hide{display:none}</style></head>
<body><main><h1>現場写真アップロード</h1><small>画像の縮小とEXIFの読取りはこの端末内で実行。原本は送信しません。</small>
<section id="login"><h2>ログイン</h2><label>メールアドレス</label><input type="email" id="email" placeholder="you@example.com"><button id="send">ログイン用メールを送る</button><p id="loginMsg"></p></section>
<section id="app" class="hide"><div id="identity"></div><button id="logout">ログアウト</button><label>案件名</label><input id="project" placeholder="例：延岡市○○町 建物調査" required><label>建物</label><select id="building"><option value="">未分類</option><option>主たる建物</option><option>附属建物</option></select><label>階</label><select id="floor"><option value="">未分類</option><option>1階</option><option>2階</option><option>3階</option><option>屋外</option></select><label>写真の長辺</label><select id="size"><option>800</option><option>1200</option><option selected>1600</option><option>2400</option></select><label>JPEG画質 <span id="qview">80%</span></label><input id="quality" type="range" min="60" max="95" value="80"><label>写真を選択（複数可）</label><input type="file" id="photos" accept="image/*" multiple><p id="files"></p><button id="upload">縮小してアップロード</button><progress id="progress" max="100" value="0"></progress><p id="status" role="status"></p><ol id="results"></ol></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://jzwghrlevmikuhvjyjdr.supabase.co','sb_publishable_ilpL_Bar6cPIXFtqeBpSeA_bRJNJFy6');
const $=id=>document.getElementById(id); let user=null;
async function refresh(){const {data}=await sb.auth.getUser();user=data.user;$('login').classList.toggle('hide',!!user);$('app').classList.toggle('hide',!user);$('identity').textContent=user?'ログイン中：'+user.email:''}
$('send').onclick=async()=>{const email=$('email').value.trim();if(!email)return; $('send').disabled=true;const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});$('loginMsg').textContent=error?error.message:'メールのリンクを開いてログインしてください';$('send').disabled=false};
$('logout').onclick=async()=>{await sb.auth.signOut();refresh()};
sb.auth.onAuthStateChange(()=>setTimeout(refresh,0)); await refresh();
$('quality').oninput=()=>{$('qview').textContent=$('quality').value+'%';localStorage.setItem('photoQuality',$('quality').value)};
$('size').onchange=()=>localStorage.setItem('photoSize',$('size').value);
$('size').value=localStorage.getItem('photoSize')||'1600';$('quality').value=localStorage.getItem('photoQuality')||'80';$('quality').oninput();
$('photos').onchange=()=>{$('files').textContent=$('photos').files.length+'枚選択'};
function limit(v){return typeof v==='number'&&Number.isFinite(v)?v:null}
function dateValue(x){if(!x)return null;let d=x instanceof Date?x:new Date(x);return Number.isNaN(d.getTime())?null:d.toISOString()}
async function resize(file,max,q){const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});const ratio=Math.min(1,max/Math.max(bmp.width,bmp.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bmp.width*ratio);canvas.height=Math.round(bmp.height*ratio);canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',q));if(!blob)throw Error('画像変換に失敗');return blob}
$('upload').onclick=async()=>{
if(!user){await refresh();if(!user)return}
const files=[...$('photos').files],project=$('project').value.trim();if(!project||!files.length){$('status').textContent='案件名と写真を選んでください';return}
$('upload').disabled=true;$('results').innerHTML='';let ok=0;
for(let i=0;i<files.length;i++){const f=files[i];$('status').textContent=(i+1)+' / '+files.length+'：'+f.name+' を処理中';try{
let ex={};try{ex=await window.exifr.parse(f,{tiff:true,exif:true,gps:true,ifd0:true})||{}}catch(e){console.warn('EXIF',e)}
const blob=await resize(f,Number($('size').value),Number($('quality').value)/100);
const id=crypto.randomUUID(),path=user.id+'/'+id+'.jpg';
const {error:upError}=await sb.storage.from('work-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(upError)throw upError;
const record={user_id:user.id,project_name:project,building_label:$('building').value||null,floor_label:$('floor').value||null,original_filename:f.name,storage_path:path,taken_at:dateValue(ex.DateTimeOriginal||ex.CreateDate),camera_make:ex.Make||null,camera_model:ex.Model||null,latitude:limit(ex.latitude),longitude:limit(ex.longitude),altitude_m:limit(ex.GPSAltitude),focal_length_mm:limit(ex.FocalLength),aperture_f_number:limit(ex.FNumber),exposure_seconds:limit(ex.ExposureTime),iso_speed:limit(ex.ISO),exif_raw:{exif_read:!!Object.keys(ex).length,original_size:f.size,resized_size:blob.size,orientation:ex.Orientation??null}};
const {error:dbError}=await sb.from('photo_records').insert(record);
if(dbError){await sb.storage.from('work-photos').remove([path]);throw dbError}
ok++;const li=document.createElement('li');li.textContent='保存：'+f.name+'（'+Math.round(f.size/1024)+'KB → '+Math.round(blob.size/1024)+'KB、GPS '+(record.latitude==null?'なし':'あり')+'）';$('results').append(li);
}catch(e){const li=document.createElement('li');li.textContent='失敗：'+f.name+' — '+(e.message||e);$('results').append(li)}
$('progress').value=(i+1)/files.length*100}
$('status').textContent=ok+' / '+files.length+'枚を保存しました';$('upload').disabled=false;
};
</script></body></html>
